<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Game</title>
    <link rel="stylesheet" href="Talking Game.css">
</head>
<body>
    <a href="../mainpage.html" class="back-link">&larr; Main Menu</a>

    <div class="talking-page">
        <!-- LEFT SIDE: a big monster picture, close up -->
        <div class="monster-side">
            <img id="monster-image" class="monster-image" alt="A curious monster" src="">
        </div>

        <!-- RIGHT SIDE: the monster's question, and a box to type an answer -->
        <div class="chat-side">
            <div class="chat-window">
                <p class="question-label">The monster asks:</p>
                <p id="question-text" class="question-text">...</p>

                <label class="answer-label" for="answer-input">Your answer:</label>
                <input
                    id="answer-input"
                    class="answer-input"
                    type="text"
                    placeholder="Type your answer and press Enter"
                    autocomplete="off"
                >
            </div>
        </div>
    </div>

    <!-- DEBUG PANEL: a plain, read-only look at the engine's state,
         for authoring/testing. Safe to delete along with its CSS in
         Talking Game.css if this ever needs to become player-facing
         only — nothing else on the page depends on it. -->
    <div id="debug-panel" class="debug-panel">
        <p class="debug-title">Engine state (debug)</p>
        <p><span class="debug-label">Turn:</span> <span id="debug-turn">0</span>
           &nbsp;&nbsp;<span class="debug-label">Trust:</span> <span id="debug-trust">0</span>
           &nbsp;&nbsp;<span class="debug-label">Mood:</span> <span id="debug-mood">0</span></p>
        <p><span class="debug-label">Topics:</span> <span id="debug-topics">—</span></p>
        <p><span class="debug-label">Facts:</span> <span id="debug-facts">—</span></p>
        <p><span class="debug-label">Debts:</span> <span id="debug-debts">—</span></p>
        <p><span class="debug-label">Learned words:</span> <span id="debug-learned">—</span></p>
        <p><span class="debug-label">Voice stage:</span> <span id="debug-voice-stage">mira</span>
           &nbsp;&nbsp;<span class="debug-label">Max tier:</span> <span id="debug-max-tier">0</span></p>
    </div>

    <!-- Load order: Lexicon.js MUST come before Monster Content.js —
         unlike everything else here, Monster Content.js reads
         window.Lexicon.FAMILIES immediately while it's loading, not
         later at runtime, so it has to already exist. Word
         Correction.js has to exist before Engine.js's render stage
         might reach for it. Talking Game.js (the page controller)
         always loads last. -->
    <script src="Lexicon.js"></script>
    <script src="Word Correction.js"></script>
    <script src="Monster Content.js"></script>
    <script src="Engine.js"></script>
    <script src="Talking Game.js"></script>
</body>
</html>
