<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <link rel="stylesheet" href="mainpage.css">
</head>
<body>
    <!-- Mute/unmute square, top-right corner — filled in by Game Audio.js.
         Empty on purpose; see Audio/Game Audio.js for what goes here. -->
    <div id="game-audio-mute-mount"></div>

    <main class="container">
        <h1 id="greeting">Hello</h1>

        <nav class="menu">
            <button class="menu-btn" data-action="start">Start Game</button>
            <button class="menu-btn" data-action="rules">Game Rules</button>
            <button class="menu-btn" data-action="cards">Card Info</button>
            <button class="menu-btn" data-action="settings">Settings</button>
            <!-- Unrelated to the card game — its own page, own folder
                 ("Talking Game/"), own save data. -->
            <button class="menu-btn" data-action="talking">Talking Game</button>
        </nav>
    </main>

    <script src="mainpage.js"></script>
    <!-- Mute button + background music. Safe to delete along with the
         mount div above — the menu works fine without it. -->
    <script src="Audio/Game Audio.js"></script>
</body>
</html>
