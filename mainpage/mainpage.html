<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <link rel="stylesheet" href="mainpage.css">
</head>
<body>
    <main class="container">
        <h1 id="greeting">Hello</h1>

        <!-- GAME REMODEL: Talking Game is now the main focus, so it's
             the only button left here. The old card-game buttons
             (Start Game / Game Rules / Card Info / Settings) are
             archived, not deleted — their pages, scripts, and the
             route entries in mainpage.js's PAGES map are all still
             sitting in their own folders untouched. Once development
             comes back around to the card game, just add their
             <button> lines back here. -->
        <nav class="menu">
            <button class="menu-btn" data-action="talking">Talking Game</button>
            <!-- Clears the Talking Game's saved localStorage state
                 (Engine.js's "talkingGameEngineState" key) so the
                 monster forgets everything and starts as a stranger
                 again. Handled separately from the menu-btn buttons
                 above since it doesn't navigate anywhere. -->
            <button id="reset-game-btn" class="menu-btn menu-btn-reset">Reset Game</button>
        </nav>
    </main>

    <script src="mainpage.js"></script>
    <!-- Music/mute button is archived for now — we'll wire the sound
         system back in later. Game Audio.js itself is untouched in
         Audio/, this is just not loading it on this page right now. -->
</body>
</html>
